<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pro 3D Offroad Racing Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #2b580c, #638c27);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        /* HUD & Dashboard */
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        .gauge { text-align: center; }
        #speedVal { font-size: 22px; font-weight: bold; color: #ffcc00; }
        .label { font-size: 10px; text-transform: uppercase; color: #ccc; }

        /* Minimap Radar Top-Left */
        #minimap {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 90px;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #playerDot {
            width: 8px;
            height: 8px;
            background: #ff3333;
            border-radius: 50%;
            position: absolute;
        }

        /* Controls Layout */
        #controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Steering Wheel */
        #steeringWheelContainer {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        #wheelCenter {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 30%, #000 90%);
            border: 4px solid #444;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s linear;
        }
        .wheel-spoke { position: absolute; background: #666; }
        .spoke-h { width: 96px; height: 8px; border-radius: 4px; }
        .spoke-v { width: 8px; height: 48px; bottom: 10px; border-radius: 4px; }
        .wheel-center-cap {
            width: 35px; height: 35px;
            background: #d9534f;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Pedals */
        .pedals { display: flex; gap: 12px; }
        .pedal {
            width: 70px; height: 105px;
            font-size: 15px; font-weight: bold;
            color: white; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        #brakeBtn { background: linear-gradient(to bottom, #d9534f, #c9302c); }
        #brakeBtn:active { transform: scale(0.95); }
        #accelBtn { background: linear-gradient(to bottom, #5cb85c, #4cae4c); }
        #accelBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Minimap -->
    <div id="minimap">
        <div id="playerDot"></div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="gauge">
            <div id="speedVal">0</div>
            <div class="label">KM/H</div>
        </div>
    </div>

    <!-- Controls -->
    <div id="controls">
        <div id="steeringWheelContainer">
            <div id="wheelCenter">
                <div class="wheel-spoke spoke-h"></div>
                <div class="wheel-spoke spoke-v"></div>
                <div class="wheel-center-cap"></div>
            </div>
        </div>
        <div class="pedals">
            <button class="pedal" id="brakeBtn">BRAKE</button>
            <button class="pedal" id="accelBtn">GAS</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, jeep;
        let speed = 0, maxSpeed = 0.85, acceleration = 0.02, deceleration = 0.015;
        let steeringAngle = 0;
        let isAccelerating = false, isBraking = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x73c2fb); // Sky Blue
            scene.fog = new THREE.Fog(0x73c2fb, 40, 250);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            dirLight.position.set(40, 80, 40);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Offroad Terrain (Hills & Dirt Road)
            createTerrain();

            // Build 4x4 Offroad Jeep
            createOffroadJeep();

            // Controls
            setupSteeringWheel();
            setupPedals();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createTerrain() {
            // Dirt Track
            const roadGeo = new THREE.PlaneGeometry(40, 4000, 32, 32);
            const pos = roadGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let vx = pos.getX(i);
                let vy = pos.getY(i);
                pos.setZ(i, Math.sin(vx * 0.1) * Math.cos(vy * 0.05) * 1.5);
            }
            roadGeo.computeVertexNormals();

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Green Grassy Hills on Sides
            const grassGeo = new THREE.PlaneGeometry(500, 4000);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x3b7a1e, roughness: 0.8 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = -0.2;
            grass.receiveShadow = true;
            scene.add(grass);

            // Add Pine Trees along the track
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e });
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40 });

            for (let i = -1800; i < 1800; i += 60) {
                createTree(25, i, treeMat, leavesMat);
                createTree(-25, i, treeMat, leavesMat);
            }
        }

        function createTree(x, z, trunkMat, leavesMat) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4), trunkMat);
            trunk.position.set(x, 2, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 6), leavesMat);
            leaves.position.set(x, 5.5, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }

        function createOffroadJeep() {
            jeep = new THREE.Group();

            // Jeep Body (Red/Yellow 4x4 SUV style)
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd9381e, metalness: 0.5, roughness: 0.3 });
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });

            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(2, 0.9, 4.2), bodyMat);
            mainBody.position.y = 0.8;
            mainBody.castShadow = true;
            jeep.add(mainBody);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 2.2), cabinMat);
            cabin.position.set(0, 1.6, -0.3);
            cabin.castShadow = true;
            jeep.add(cabin);

            // Spare Tire at the back (like in pictures)
            const spareTireGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16);
            spareTireGeo.rotateZ(Math.PI / 2);
            const spareTire = new THREE.Mesh(spareTireGeo, new THREE.MeshStandardMaterial({ color: 0x111111 }));
            spareTire.position.set(0, 1.1, -2.2);
            jeep.add(spareTire);

            // 4 Massive Offroad Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.4, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

            const wheelPositions = [
                [-1.1, 0.55, 1.4], [1.1, 0.55, 1.4],
                [-1.1, 0.55, -1.4], [1.1, 0.55, -1.4]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                jeep.add(wheel);
            });

            jeep.position.set(0, 0.5, 0);
            scene.add(jeep);
        }

        function setupSteeringWheel() {
            const container = document.getElementById('steeringWheelContainer');
            const center = document.getElementById('wheelCenter');
            let isDragging = false, startAngle = 0, currentRotation = 0;

            const getAngle = (e) => {
                const rect = container.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
            };

            container.addEventListener('mousedown', (e) => { isDragging = true; startAngle = getAngle(e) - currentRotation; });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                currentRotation = Math.max(-90, Math.min(90, getAngle(e) - startAngle));
                center.style.transform = `rotate(${currentRotation}deg)`;
                steeringAngle = currentRotation / 90;
            });
            window.addEventListener('mouseup', () => { isDragging = false; currentRotation = 0; center.style.transform = `rotate(0deg)`; steeringAngle = 0; });

            container.addEventListener('touchstart', (e) => { isDragging = true; startAngle = getAngle(e) - currentRotation; });
            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentRotation = Math.max(-90, Math.min(90, getAngle(e) - startAngle));
                center.style.transform = `rotate(${currentRotation}deg)`;
                steeringAngle = currentRotation / 90;
            });
            window.addEventListener('touchend', () => { isDragging = false; currentRotation = 0; center.style.transform = `rotate(0deg)`; steeringAngle = 0; });
        }

        function setupPedals() {
            const bindBtn = (id, start, end) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
                el.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
            };
            bindBtn('accelBtn', () => isAccelerating = true, () => isAccelerating = false);
            bindBtn('brakeBtn', () => isBraking = true, () => isBraking = false);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') isAccelerating = true;
                if (e.key === 'ArrowDown' || e.key === 's') isBraking = true;
                if (e.key === 'ArrowLeft' || e.key === 'a') steeringAngle = -1;
                if (e.key === 'ArrowRight' || e.key === 'd') steeringAngle = 1;
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') isAccelerating = false;
                if (e.key === 'ArrowDown' || e.key === 's') isBraking = false;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') steeringAngle = 0;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAccelerating) speed = Math.min(speed + acceleration, maxSpeed);
            else if (isBraking) speed = Math.max(speed - (deceleration * 2), 0);
            else speed = Math.max(speed - deceleration, 0);

            if (speed > 0.02) jeep.rotation.y -= steeringAngle * 0.035;

            jeep.translateOnAxis(new THREE.Vector3(0, 0, 1), speed);
            jeep.position.x = Math.max(-18, Math.min(18, jeep.position.x));

            // Smooth Chase Camera
            const targetX = jeep.position.x;
            const targetY = jeep.position.y + 3.5;
            const targetZ = jeep.position.z - 8;

            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.y = targetY;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            camera.lookAt(jeep.position.x, jeep.position.y + 1, jeep.position.z + 3);

            // Update Speed & Minimap dot
            document.getElementById('speedVal').innerText = Math.round(speed * 130);
            const dot = document.getElementById('playerDot');
            dot.style.top = `${45 - (jeep.position.z * 0.02)}px`;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
