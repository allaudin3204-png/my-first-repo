<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Driving Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; font-size: 18px; text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        #controls {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: center; gap: 15px;
        }
        .btn {
            padding: 15px 25px; font-size: 18px; background: #ff5722; color: white;
            border: none; border-radius: 8px; cursor: pointer; user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { background: #e64a19; transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="info">3D Car Driving Simulator<br>Use buttons below to drive!</div>
    
    <div id="controls">
        <button class="btn" id="leftBtn">◀ Left</button>
        <button class="btn" id="accelerateBtn">▲ Forward</button>
        <button class="btn" id="rightBtn">Right ▶</button>
    </div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, car;
        let moveLeft = false, moveRight = false, moveForward = false;
        let carSpeed = 0;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Road
            const roadGeo = new THREE.PlaneGeometry(20, 500);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // Simple 3D Car
            const carGroup = new THREE.Group();
            
            // Car Body
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const carBody = new THREE.Mesh(bodyGeo, bodyMat);
            carBody.position.y = 0.6;
            carGroup.add(carBody);

            // Car Cabin
            const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const carCabin = new THREE.Mesh(cabinGeo, cabinMat);
            carCabin.position.set(0, 1.3, -0.2);
            carGroup.add(carCabin);

            car = carGroup;
            car.position.set(0, 0, 5);
            scene.add(car);

            // Touch / Click Controls for Mobile
            setupControls();

            // Resize listener
            window.addEventListener('resize', onWindowResize);
        }

        function setupControls() {
            const lBtn = document.getElementById('leftBtn');
            const rBtn = document.getElementById('rightBtn');
            const aBtn = document.getElementById('accelerateBtn');

            lBtn.addEventListener('touchstart', () => { moveLeft = true; });
            lBtn.addEventListener('touchend', () => { moveLeft = false; });
            lBtn.addEventListener('mousedown', () => { moveLeft = true; });
            lBtn.addEventListener('mouseup', () => { moveLeft = false; });

            rBtn.addEventListener('touchstart', () => { moveRight = true; });
            rBtn.addEventListener('touchend', () => { moveRight = false; });
            rBtn.addEventListener('mousedown', () => { moveRight = true; });
            rBtn.addEventListener('mouseup', () => { moveRight = false; });

            aBtn.addEventListener('touchstart', () => { moveForward = true; });
            aBtn.addEventListener('touchend', () => { moveForward = false; });
            aBtn.addEventListener('mousedown', () => { moveForward = true; });
            aBtn.addEventListener('mouseup', () => { moveForward = false; });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Car movement physics
            if (moveForward) {
                carSpeed = 0.2;
            } else {
                carSpeed *= 0.95; // friction/slow down
            }

            car.position.z -= carSpeed;

            if (moveLeft && car.position.x > -8) {
                car.position.x -= 0.15;
            }
            if (moveRight && car.position.x < 8) {
                car.position.x += 0.15;
            }

            // Follow camera behind car
            camera.position.x = car.position.x;
            camera.position.z = car.position.z + 8;
            camera.lookAt(car.position.x, car.position.y, car.position.z - 5);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
